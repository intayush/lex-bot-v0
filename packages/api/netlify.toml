[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @legal-chatbot/shared build && pnpm --filter @legal-chatbot/api build"
  publish = "packages/api/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Disable Netlify CSRF protection — Next.js server actions handle their own CSRF
  NETLIFY_NEXT_CSRF_PROTECTION = "false"
